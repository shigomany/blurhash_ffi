  precheck:rust-targets:
    desc: Downloading Rust comaptible targets.
    dir: rust
    vars:
      DARWIN_TARGETS: '{{ concat .IOS_TARGET_ARHS .IOS_SIM_TARGET_ARHS .MACOS_TARGET_ARHS }}'
    cmds:
      - for: { var: DARWIN_TARGETS, as: TARGET }
        cmd: rustup target add {{.TARGET | replace "[" "" | replace "]" ""}}
        platforms: [darwin]
      - cargo install cargo-lipo

  precheck:dependencies:
    desc: Installing required dependencies.
    cmds:
      - cargo install cargo-lipo

  precheck:all:
    desc: All precheck required dependencies.
    cmds:
      - task: precheck:rust-targets
      - task: precheck:dependencies