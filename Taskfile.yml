  build:macos:
    desc: Build for macOs targets.
    dir: rust
    platforms: [darwin]
    cmds:
      - for: { var: MACOS_TARGET_ARHS, as: ARCH }
        cmd: cargo build --lib --release --target {{.ARCH}}
      - rm -rf ../ios/Libraries/lib{{.TARGET_LIB_NAME}}-macos.a
      - 'lipo -create -output ../ios/Libraries/lib{{.TARGET_LIB_NAME}}-macos.a {{range $arch := .MACOS_TARGET_ARHS}}target/{{$arch}}/release/lib{{$.TARGET_LIB_NAME}}.a {{end}}'
      - lipo -info ../ios/Libraries/lib{{.TARGET_LIB_NAME}}-macos.a
      #   platforms: [darwin]
