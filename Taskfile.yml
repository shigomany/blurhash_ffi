# https://taskfile.dev

version: '3'

vars:
  TARGET_LIB_NAME: blurhash_ffi
  FRAMEWORK_NAME: blurhash_ffi
  IOS_SIM_TARGET_ARHS: ['x86_64-apple-ios', 'aarch64-apple-ios-sim']
  IOS_TARGET_ARHS: ['aarch64-apple-ios', 'aarch64-apple-ios-macabi']
  MACOS_TARGET_ARHS: ['aarch64-apple-darwin', 'x86_64-apple-darwin']
  EXTENSION_LIB: '{{if eq OS "windows"}}dll{{else if eq OS "darwin"}}dylib{{else}}so{{end}}'

tasks:
  generate:bindings:
    desc: Generate the bindings for the native Rust code
    dir: rust
    cmds:
      - cbindgen --config cbindgen.toml --crate blurhash-ffi --output ../ios/Classes/{{.TARGET_LIB_NAME}}.h
  
  generate:ffi:
    desc: Generate the FFI bindings for the native Rust code
    cmds:
      - flutter pub run ffigen --config ffigen.yaml

  generate:all:
    desc: Generate all files
    cmds:
      - task: generate:bindings
      - task: generate:ffi

  build:wasm:
    desc: Build the WASM code in debug mode
    dir: rust
    cmds:
      - wasm-pack build --target web

  build:clean:
    desc: Clean build folders
    dir: rust
    cmds:
      - cargo clean
  # copy-file:
  #   desc: Coping the file to destination folder
  #   internal: true
  #   vars:
  #     FROM_FOLDER: '{{default "pkg" .FROM_FOLDER}}'
  #     TO_FOLDER: '{{default "bin" .TO_FOLDER}}'
  #     FILE: '{{default "blurhash_ffi_bg.wasm" .FILE}}'
  #     # Constant variables
  #     FILE_NAME: '{{trimSuffix (printf ".%s" .FILE_EXTENSION) .FILE}}'
  #     FILE_EXTENSION: '{{last (splitList "." .FILE)}}'
  #     CMD_COPY: '{{if eq OS "windows"}}copy{{else}}cp{{end}}'
  #     CMD_RENAME: '{{if eq OS "windows"}}ren{{else}}mv{{end}}'
  #   cmds:
  #     - cmd: '{{.CMD_COPY}} {{.FROM_FOLDER}}/{{.FILE}} {{.TO_FOLDER}}/{{.FILE}} &&
  #             {{.CMD_RENAME}} {{.TO_FOLDER}}/{{.FILE}} {{.TO_FOLDER}}/{{.TARGET_LIB_NAME}}.{{.FILE_EXTENSION}}'
  
  copy-folder:
    desc: Coping the folder to destination folder
    internal: true
    preconditions:
      - sh: '{{if env "FROM_FOLDER" }} exit 1 {{end}}'
        msg: 'Variable `FROM_FOLDER` is required'
      - sh: '{{if env "TO_FOLDER" }} exit 1 {{end}}'
        msg: 'Variable `TO_FOLDER` is required'
      - sh: '{{if env "DELETE_FOLDER" }} exit 1 {{end}}'
        msg: 'Variable `DELETE_FOLDER` is required'
    vars:
      # Constant variables
      CMD_COPY: '{{if eq OS "windows"}}xcopy{{else}}cp -R{{end}}'
      CMD_REMOVE: '{{if eq OS "windows"}}rmdir /s /q{{else}}rm -rf{{end}}'
    cmds:
      - cmd: '{{ if .DELETE_FOLDER }}{{$.CMD_REMOVE}} {{$.TO_FOLDER}} {{else}} echo "Coping without deletion" {{end}}'
      - cmd: '{{.CMD_COPY}} {{.FROM_FOLDER}} {{.TO_FOLDER}} {{if eq OS "windows"}}/E /I /Y{{end}}'

  build:wasm-release:
    desc: Build the WASM code in release mode
    dir: rust
    cmds:
      - wasm-pack build --release --target web
      - task: copy-file
        vars:
          FROM_FOLDER: pkg
          TO_FOLDER: bin
          FILE: blurhash_ffi_bg.wasm

  build:ios:
    desc: Build for iOS targets.
    dir: rust
    platforms: [darwin]
    vars:
