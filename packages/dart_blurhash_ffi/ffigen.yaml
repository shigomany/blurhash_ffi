name: DartBlurhashFfi
description: C bindings to the blurhash ffi
ffi-native:
language: c
headers:
  entry-points:
    - "rust/include/bindings.h"
compiler-opts:
  # Suppress nullability warnings on macOS
  - "-Wno-nullability-completeness"
  # Ignore warnings about availability macro
  - "-Wno-availability"
output:
  bindings: "lib/src/bindings.g.dart"
# comments:
#   style: any
#   length: full
exclude-all-by-default: true
structs:
  include:
    - "Wrapped.*"
functions:
  include:
    - "blurhash_.*"
  # leaf:
  #   # All C APIs are leaf functions (e.g. they do not call into Dart)
  #   include:
  #     - ".*"