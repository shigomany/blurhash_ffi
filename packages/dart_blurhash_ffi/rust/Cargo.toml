[package]
name = "blurhash_ffi"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
blurhash = { version = "0.2.3", features = ["image"] }
image = "0.25.5"

[build-dependencies]
build-target = "0.7"
cbindgen = "0.29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.105"
